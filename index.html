<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETH 实时预警系统</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #111; color: #fff; }
    h1 { color: #0ff; }
    #log { white-space: pre-wrap; margin-top: 20px; font-size: 14px; }
    .alert { color: #f00; font-weight: bold; }
  </style>
</head>
<body>
  <h1>ETH 实时预警系统</h1>
  <div id="log"></div>
  <script>
    const logDiv = document.getElementById('log');
    const priceData = [];
    const volumeData = [];
    const MAX_BARS = 200;

    const ws = new WebSocket("wss://ws.okx.com:8443/ws/v5/public");
    ws.onopen = () => {
      ws.send(JSON.stringify({
        op: "subscribe",
        args: [{
          channel: "candle1s",
          instId: "ETH-USDT"
        }]
      }));
    };

    function log(message, alert = false) {
      logDiv.innerHTML = `<div class='${alert ? 'alert' : ''}'>${new Date().toLocaleTimeString()} - ${message}</div>` + logDiv.innerHTML;
    }

    function calculateMA(data, length) {
      if (data.length < length) return null;
      return data.slice(-length).reduce((sum, val) => sum + val, 0) / length;
    }

    function calculateMACD(closes) {
      if (closes.length < 35) return null;
      const ema = (data, period) => {
        let k = 2 / (period + 1);
        return data.reduce((arr, curr, idx) => {
          if (idx === 0) arr.push(curr);
          else arr.push(curr * k + arr[arr.length - 1] * (1 - k));
          return arr;
        }, []);
      };
      let ema12 = ema(closes, 12);
      let ema26 = ema(closes, 26);
      let dif = ema12.map((v, i) => v - ema26[i]);
      let dea = ema(dif, 9);
      let macd = dif.map((v, i) => 2 * (v - dea[i]));
      return { dif, dea, macd };
    }

    function calculateKDJ(data) {
      if (data.length < 9) return null;
      let RSVs = data.map((d, i) => {
        if (i < 8) return null;
        let slice = data.slice(i - 8, i + 1);
        let high = Math.max(...slice.map(d => d.high));
        let low = Math.min(...slice.map(d => d.low));
        return ((d.close - low) / (high - low)) * 100;
      });
      let K = [], D = [], J = [];
      RSVs.forEach((rsv, i) => {
        if (rsv === null) {
          K.push(null); D.push(null); J.push(null);
        } else {
          let prevK = K[i - 1] || 50;
          let prevD = D[i - 1] || 50;
          let k = 2 / 3 * prevK + 1 / 3 * rsv;
          let d = 2 / 3 * prevD + 1 / 3 * k;
          let j = 3 * k - 2 * d;
          K.push(k); D.push(d); J.push(j);
        }
      });
      return { K, D, J };
    }

    ws.onmessage = (msg) => {
      const json = JSON.parse(msg.data);
      if (!json.data) return;
      const candle = json.data[0];
      const [ts, o, h, l, c, vol] = candle.map(Number);

      priceData.push({ close: c, high: h, low: l });
      volumeData.push(vol);

      if (priceData.length > MAX_BARS) priceData.shift();
      if (volumeData.length > MAX_BARS) volumeData.shift();

      const closes = priceData.map(p => p.close);
      const macd = calculateMACD(closes);
      const kdj = calculateKDJ(priceData);
      const avgVol = calculateMA(volumeData, 20);

      if (macd && macd.macd.slice(-2)[0] < 0 && macd.macd.slice(-1)[0] > 0) {
        log("MACD 金叉⚡️", true);
      }

      if (kdj && kdj.K.slice(-2)[0] < kdj.D.slice(-2)[0] && kdj.K.slice(-1)[0] > kdj.D.slice(-1)[0]) {
        log("KDJ 金叉⚡️", true);
      }

      if (vol > 2 * avgVol) {
        log(`放量突破：${vol.toFixed(2)} > 2×均量(${avgVol.toFixed(2)}) 🚀`, true);
      }
    };
  </script>
</body>
</html>
