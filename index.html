<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETH 实时预警系统</title>
    <style>
      body {
        background-color: #111;
        color: #0ff;
        font-family: 'Arial', sans-serif;
        padding: 20px;
      }
      h1 {
        color: #0ff;
      }
      .metrics {
        margin-top: 20px;
        font-size: 1.2em;
        line-height: 1.8em;
      }
      .alert {
        color: #f00;
        font-weight: bold;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <h1>ETH 实时预警系统</h1>
    <div class="metrics">
      <div>当前时间：<span id="time">--:--:--</span></div>
      <div>当前成交量：<span id="volume">--</span></div>
      <div>平均成交量（20根K线）：<span id="avgVolume">--</span></div>
      <div>MACD 金叉：<span id="macd">--</span></div>
      <div>KDJ 金叉：<span id="kdj">--</span></div>
      <div>是否放量：<span id="volumeSpike">--</span></div>
    </div>
    <div class="alert" id="alert"></div>

    <script>
      const fetchIndicators = async () => {
        const time = new Date().toLocaleTimeString();
        document.getElementById('time').textContent = time;

        try {
          const res = await fetch(
            'https://api.taapi.io/bulk',
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                secret: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJjbHVlIjoiNjgwMGI2NzM4MDZmZjE2NTFlNmM1NGUzIiwiaWF0IjoxNzQ0ODc3MzY3LCJleHAiOjMzMjQ5MzQxMzY3fQ.I4olPW4Y7hpXY6mZfwcbPQBz4rX9lHNb9c_bwRz8N0U',
                construct: {
                  exchange: 'binance',
                  symbol: 'ETH/USDT',
                  interval: '1m',
                  indicators: [
                    { indicator: 'macd' },
                    { indicator: 'kdj' },
                    { indicator: 'rma', optInTimePeriod: 20, indicatorName: 'volume' },
                    { indicator: 'vwap' } // 取当前成交量
                  ]
                }
              })
            }
          );
          const data = await res.json();

          const macdCross = data.results[0].value.MACD > data.results[0].value.signal;
          const kdjCross = data.results[1].value.k > data.results[1].value.d;
          const avgVol = data.results[2].value;
          const currVol = data.results[3].value.volume;

          const isVolumeSpike = currVol > avgVol * 2;

          document.getElementById('volume').textContent = currVol.toFixed(2);
          document.getElementById('avgVolume').textContent = avgVol.toFixed(2);
          document.getElementById('macd').textContent = macdCross ? '是 ✅' : '否';
          document.getElementById('kdj').textContent = kdjCross ? '是 ✅' : '否';
          document.getElementById('volumeSpike').textContent = isVolumeSpike ? '是 ✅' : '否';

          if ((macdCross || kdjCross) && isVolumeSpike) {
            document.getElementById('alert').textContent = '⚠️ 预警：金叉 + 放量！';
          } else {
            document.getElementById('alert').textContent = '';
          }
        } catch (e) {
          console.error(e);
        }
      };

      fetchIndicators();
      setInterval(fetchIndicators, 1000);
    </script>
  </body>
</html>
