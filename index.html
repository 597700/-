<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>ETH 实时预警系统</title>
  <style>
    body {
      background-color: #111;
      color: #5fffe7;
      font-family: Consolas, monospace;
      padding: 30px;
    }
    h1 {
      font-size: 24px;
    }
    .data-block {
      background: #222;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      line-height: 1.6;
    }
    .highlight {
      color: #ff5e5e;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>ETH 实时预警系统</h1>
  <div class="data-block" id="data"></div>

  <script>
    async function fetchIndicatorData() {
      try {
        const res = await fetch("https://api.taapi.io/bulk", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            secret: "YOUR_TAAPI_KEY",
            construct: [
              { exchange: "binance", symbol: "ETH/USDT", interval: "1m", indicator: "macd" },
              { exchange: "binance", symbol: "ETH/USDT", interval: "1m", indicator: "kdj" },
              { exchange: "binance", symbol: "ETH/USDT", interval: "1m", indicator: "vwap" },
              { exchange: "binance", symbol: "ETH/USDT", interval: "1m", indicator: "rsi" },
              { exchange: "binance", symbol: "ETH/USDT", interval: "1m", indicator: "sma", optInTimePeriod: 20 },
              { exchange: "binance", symbol: "ETH/USDT", interval: "1m", indicator: "sma", optInTimePeriod: 7 },
              { exchange: "binance", symbol: "ETH/USDT", interval: "1m", indicator: "sma", optInTimePeriod: 30 },
              { exchange: "binance", symbol: "ETH/USDT", interval: "1m", indicator: "volume" }
            ]
          })
        });

        const result = await res.json();
        const macd = result.results[0].value;
        const kdj = result.results[1].value;
        const volume = result.results[7].value;
        const avgVol = result.results[4].value; // 20-period SMA as avg vol

        const isMACDGolden = macd.MACD > macd.signal;
        const isKDJGolden = kdj.k > kdj.d;
        const isVolumeSpike = volume > avgVol * 2;

        const now = new Date().toLocaleTimeString();

        let html = `
          <div>当前时间：${now}</div>
          <div>当前成交量：${volume.toFixed(2)} ETH</div>
          <div>平均成交量（20根K线）：${avgVol.toFixed(2)} ETH</div>
          <div>MACD：DIF = ${macd.MACD.toFixed(4)}，DEA = ${macd.signal.toFixed(4)} ${isMACDGolden ? '<span class="highlight">（金叉 ✅）</span>' : ''}</div>
          <div>KDJ：K = ${kdj.k.toFixed(2)}，D = ${kdj.d.toFixed(2)} ${isKDJGolden ? '<span class="highlight">（金叉 ✅）</span>' : ''}</div>
        `;

        if ((isMACDGolden || isKDJGolden) && isVolumeSpike) {
          html += `<div class="highlight">⚠️ 警报：ETH 出现金叉 + 放量！已触发预警 🚨</div>`;
        }

        document.getElementById("data").innerHTML = html;
      } catch (err) {
        console.error("获取失败", err);
      }
    }

    setInterval(fetchIndicatorData, 1000); // 每秒刷新一次
    fetchIndicatorData();
  </script>
</body>
</html>
